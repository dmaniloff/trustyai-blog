name: PR Preview - GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site for preview
        run: npm run build
        env:
          # Build without the base path for preview deployment
          PREVIEW_BUILD: true

      - name: Upload to GitHub Pages (Preview)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          name: 'pr-preview-${{ github.event.pull_request.number }}'

      - name: Comment PR with preview info
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('## 🔍 Preview')
            );

            const body = `## 🔍 Preview
            
            📖 A preview of this PR has been built and is available as an artifact.
            
            **To view the preview:**
            1. Go to the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Download the \`pr-preview-${{ github.event.pull_request.number }}\` artifact
            3. Extract and serve the files locally, or
            4. Upload to any static hosting service
            
            **Local preview:**
            \`\`\`bash
            # Extract the artifact and serve locally
            npx serve extracted-folder
            \`\`\`
            
            This preview uses the same build process as production but without the GitHub Pages base path.
            
            ---
            *This comment will be updated on subsequent commits.*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }